# Cloudflare bypass for kinozal (warp/flaresolverr/cffetch) — off by default,
# gated behind the `cfbypass` profile inside docker-compose.cfbypass.yml.
# One switch in .env turns the whole thing on: COMPOSE_PROFILES=cfbypass
# (see comments in that file for why it's a single variable).
include:
  - docker-compose.cfbypass.yml

services:
  db:
    image: postgres:16-alpine
    container_name: movies-api-db
    restart: unless-stopped
    command: postgres -c jit=off
    environment:
      POSTGRES_USER: ${DB_USER:-movies_api}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-movies_api}
      POSTGRES_DB: ${DB_NAME:-movies_api}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-movies_api} -d ${DB_NAME:-movies_api}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: movies-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgres://${DB_USER:-movies_api}:${DB_PASSWORD:-movies_api}@db:5432/${DB_NAME:-movies_api}?sslmode=disable
      - PORT=${PORT:-8888}
      # Empty unless COMPOSE_PROFILES=cfbypass is set (see docker-compose.cfbypass.yml) —
      # ${VAR:+word} yields word only when VAR is set and non-empty.
      - FLARESOLVERR_URL=${COMPOSE_PROFILES:+http://flaresolverr:8191/v1}
      - CFFETCH_URL=${COMPOSE_PROFILES:+http://cffetch:8192/fetch}
    ports:
      - "${PORT:-8888}:${PORT:-8888}"
    volumes:
      - ./plugins:/app/plugins
      - logs_data:/app/logs
      - cache_data:/app/cache
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
  logs_data:
  cache_data:
