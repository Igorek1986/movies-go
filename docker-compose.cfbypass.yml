# Cloudflare bypass for trackers behind a JS challenge (currently kinozal.me,
# see dev/kinozal.md). Optional, separate stack — NOT part of the main
# docker-compose.yml, deployed only on hosts with room for a headless
# Chromium (~1GB+). `docker compose up -d --build` alone never starts this.
#
# Two ways to run it on a host that wants it:
#
#   A) Explicit, on demand:
#        docker compose -f docker-compose.cfbypass.yml up -d
#
#   B) Folded into the regular `docker compose up` (same pattern as this
#      box's antizapret stack): copy or symlink this file to
#      docker-compose.override.yml (gitignored — stays local to this host,
#      `git pull` on another host never creates it) —
#        ln -s docker-compose.cfbypass.yml docker-compose.override.yml
#      Compose auto-merges docker-compose.override.yml, so a plain
#      `docker compose up -d --build` then also brings up warp/flaresolverr/cffetch.
#
# Either way, point the app at it (main docker-compose.yml's `app` service
# already has extra_hosts: host.docker.internal:host-gateway) via .env:
#
#   FLARESOLVERR_URL=http://host.docker.internal:8191/v1
#   CFFETCH_URL=http://host.docker.internal:8192/fetch
#
# Ports are bound to 127.0.0.1 only — never publish 8191/8192 externally.

name: movies-go-cfbypass

services:
  # Cloudflare WARP SOCKS egress — a cleaner exit IP for the FlareSolverr
  # browser than a plain datacenter IP. Persist /var/lib/cloudflare-warp so
  # registration survives restarts (a fresh identity re-triggers challenges
  # more often).
  warp:
    image: caomingjun/warp
    container_name: cfbypass-warp
    restart: unless-stopped
    device_cgroup_rules:
      - "c 10:200 rwm"
    environment:
      - WARP_SLEEP=2
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - cfbypass-warp-data:/var/lib/cloudflare-warp

  # Solves the JS challenge once per host (headless Chromium — the heavy
  # part, ~1GB RAM). Do not publish 8191 externally.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: cfbypass-flaresolverr
    restart: unless-stopped
    depends_on:
      - warp
    ports:
      - "127.0.0.1:8191:8191"
    environment:
      - LOG_LEVEL=info
      - PROXY_URL=socks5://warp:1080
      - DISABLE_MEDIA=true
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "2"

  # Chrome TLS fingerprint (curl_cffi) fast path, reusing the cf_clearance
  # cookie FlareSolverr obtained — avoids running the browser per request.
  #
  # impersonate=chrome131, not jacred's default chrome136: tested against
  # kinozal.me on 2026-09-15 — chrome136 got 403/cf-mitigated even with a
  # fresh cf_clearance cookie + matching User-Agent (Cloudflare didn't like
  # that exact TLS/JA fingerprint for this site); chrome131/124/123/120 all
  # passed (200, not mitigated). Re-check if kinozal starts rejecting this
  # profile too — Cloudflare's fingerprint denylist shifts over time.
  cffetch:
    image: ghcr.io/jacred-fdb/cffetch:latest
    container_name: cfbypass-cffetch
    restart: unless-stopped
    depends_on:
      - warp
    ports:
      - "127.0.0.1:8192:8192"
    environment:
      - CFFETCH_BIND=0.0.0.0
      - CFFETCH_PROXY=socks5://warp:1080
      - CFFETCH_IMPERSONATE=chrome131
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1"

volumes:
  cfbypass-warp-data:
