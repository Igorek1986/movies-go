# Cloudflare bypass for trackers behind a JS challenge (currently kinozal.me,
# see dev/kinozal.md). Included by the main docker-compose.yml (`include:`),
# so it's part of the same project/command/network — but every service here
# is gated behind the `cfbypass` Compose profile, so `docker compose up -d
# --build` alone never starts them.
#
# One switch, in .env:
#
#   COMPOSE_PROFILES=cfbypass
#
# That both activates this profile (Compose reads COMPOSE_PROFILES from the
# environment same as --profile) AND — via docker-compose.yml's
# `${COMPOSE_PROFILES:+...}` on the `app` service — turns on
# FLARESOLVERR_URL/CFFETCH_URL. Remove/comment that one line to turn the
# whole thing back off; `docker compose up -d --build` stays the same
# command either way. No .env URLs to manage, no separate `-f` flag, no
# docker-compose.override.yml.
#
# Ports are also bound to 127.0.0.1 for manual debugging (curl) — never
# publish 8191/8192 externally. Heavy: headless Chromium, ~1GB+ RAM — only
# turn this profile on where there's room (see dev/kinozal.md for why vps
# stays off and deb is the intended host).

services:
  # Cloudflare WARP SOCKS egress — a cleaner exit IP for the FlareSolverr
  # browser than a plain datacenter IP. Persist /var/lib/cloudflare-warp so
  # registration survives restarts (a fresh identity re-triggers challenges
  # more often).
  warp:
    image: caomingjun/warp
    container_name: cfbypass-warp
    profiles: ["cfbypass"]
    restart: unless-stopped
    device_cgroup_rules:
      - "c 10:200 rwm"
    environment:
      - WARP_SLEEP=2
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - cfbypass-warp-data:/var/lib/cloudflare-warp

  # Solves the JS challenge once per host (headless Chromium — the heavy
  # part, ~1GB RAM). Do not publish 8191 externally.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: cfbypass-flaresolverr
    profiles: ["cfbypass"]
    restart: unless-stopped
    depends_on:
      warp:
        condition: service_healthy
    ports:
      - "127.0.0.1:8191:8191"
    environment:
      - LOG_LEVEL=info
      - PROXY_URL=socks5://warp:1080
      - DISABLE_MEDIA=true
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "2"

  # Chrome TLS fingerprint (curl_cffi) fast path, reusing the cf_clearance
  # cookie FlareSolverr obtained — avoids running the browser per request.
  #
  # impersonate=chrome131, not jacred's default chrome136: tested against
  # kinozal.me on 2026-09-15 — chrome136 got 403/cf-mitigated even with a
  # fresh cf_clearance cookie + matching User-Agent (Cloudflare didn't like
  # that exact TLS/JA fingerprint for this site); chrome131/124/123/120 all
  # passed (200, not mitigated). Re-check if kinozal starts rejecting this
  # profile too — Cloudflare's fingerprint denylist shifts over time.
  cffetch:
    image: ghcr.io/jacred-fdb/cffetch:latest
    container_name: cfbypass-cffetch
    profiles: ["cfbypass"]
    restart: unless-stopped
    depends_on:
      warp:
        condition: service_healthy
    ports:
      - "127.0.0.1:8192:8192"
    environment:
      - CFFETCH_BIND=0.0.0.0
      - CFFETCH_PROXY=socks5://warp:1080
      - CFFETCH_IMPERSONATE=chrome131
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1"

volumes:
  cfbypass-warp-data:
